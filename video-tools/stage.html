<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Inter;font-weight:400;src:url(fonts/inter-latin-400-normal.woff2)}
@font-face{font-family:Inter;font-weight:500;src:url(fonts/inter-latin-500-normal.woff2)}
@font-face{font-family:Inter;font-weight:600;src:url(fonts/inter-latin-600-normal.woff2)}
@font-face{font-family:Inter;font-weight:700;src:url(fonts/inter-latin-700-normal.woff2)}
@font-face{font-family:Inter;font-weight:800;src:url(fonts/inter-latin-800-normal.woff2)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#FBF1F3}
body{font-family:Inter,sans-serif;color:#1D1A1C;-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden}
#bg{position:absolute;inset:-100px;background:linear-gradient(160deg,#FDF5F6 0%,#FAEBEE 55%,#F7E2E6 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55}
.scene{position:absolute;inset:0;will-change:transform,opacity,filter}
.abs{position:absolute}
.tb .badge{display:flex;align-items:center;gap:14px;font-size:22px;font-weight:500;color:#8A8285}
.tb .num{width:38px;height:38px;border-radius:50%;background:#1D1A1C;color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center}
.tb h1{font-size:68px;line-height:1.06;font-weight:800;letter-spacing:-.025em;margin-top:22px}
.tb h1 span,.words span{display:inline-block;margin-right:.24em}
.tb p{font-size:27px;line-height:1.4;color:#7E7579;margin-top:22px;font-weight:450}
.phone{position:absolute;width:414px;height:868px;border-radius:62px;background:#1D1A1C;padding:12px;box-shadow:0 40px 90px rgba(90,20,35,.28),0 8px 20px rgba(90,20,35,.12);transform-origin:50% 50%}
.phone .scr{position:relative;width:390px;height:844px;border-radius:50px;overflow:hidden;background:#fff}
.phone canvas{width:390px;height:844px;display:block}
.phone .notch{position:absolute;top:22px;left:50%;margin-left:-55px;width:110px;height:30px;border-radius:20px;background:#1D1A1C}
.rip{position:absolute;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;background:rgba(229,50,45,.35);border:3px solid rgba(229,50,45,.8);opacity:0;pointer-events:none}
.card{background:#fff;border-radius:28px;box-shadow:0 2px 4px rgba(60,20,25,.05),0 18px 44px rgba(60,20,25,.10)}
.lbl{font-size:16px;font-weight:600;color:#8A8285;display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:10px;padding:12px 20px;border-radius:999px;background:#fff;font-size:21px;font-weight:600;box-shadow:0 6px 20px rgba(60,20,25,.10);white-space:nowrap}
.chip .d{width:9px;height:9px;border-radius:50%;background:#E5322D}
.chip.red{background:#E5322D;color:#fff}.chip.red .d{background:#fff}
.chip.dark{background:#1D1A1C;color:#fff}
.hl{transition:none;border-radius:8px;padding:0 4px;margin:0 -4px}
.coral{color:#E5322D}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.thumb{position:absolute;width:58px;height:44px;border-radius:9px;overflow:hidden;background:#f3e5e7}
.thumb canvas{width:58px;height:44px;display:block}
.browser{position:absolute;border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 40px 100px rgba(90,20,35,.25)}
.browser .bar{height:44px;background:#F4EDEE;display:flex;align-items:center;gap:9px;padding:0 18px}
.browser .bar i{width:13px;height:13px;border-radius:50%;background:#E3D3D5;display:block}
.browser .url{margin-left:22px;height:26px;width:420px;border-radius:8px;background:#fff;font-size:14px;color:#8A8285;display:flex;align-items:center;padding-left:12px}
.ring{position:absolute;border:4px solid #E5322D;border-radius:26px;opacity:0}
.stamp{position:absolute;padding:14px 26px;border-radius:999px;font-weight:800;font-size:24px;display:flex;align-items:center;gap:10px;opacity:0}
</style></head>
<body><div id="stage"><div id="bg"><div class="blob" id="b1" style="width:900px;height:900px;background:#F9D9DE;left:1100px;top:-200px"></div><div class="blob" id="b2" style="width:700px;height:700px;background:#FCEDE4;left:-100px;top:600px"></div></div></div>
<script>
const W = 1920, H = 1080, FPS = 30;
const $ = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstChild; };
const stage = document.getElementById('stage');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eio = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const back = (x) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;
const ICON = {
  mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
  spark: '<path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2 2-6z"/>',
  check: '<path d="M5 12l5 5L20 7"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  speaker: '<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/>',
  key: '<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3"/>',
  chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
};
const ic = (n, s = 22) => `<svg class="ic" viewBox="0 0 24 24" style="width:${s}px;height:${s}px">${ICON[n]}</svg>`;

let M, G, IMG = {};
async function load() {
  M = await (await fetch('cap/manifest.json')).json();
  G = await (await fetch('grid.json')).json();
  const srcs = new Set();
  for (const [k, v] of Object.entries(M)) if (Array.isArray(v)) v.forEach((x) => srcs.add(Array.isArray(x) ? x[1] : x));
  await Promise.all([...srcs].map(async (s) => { const im = new Image(); im.src = s; await im.decode(); IMG[s] = im; }));
  await document.fonts.ready;
}
const frameAt = (clip, ms) => { const f = M[clip]; let r = f[0][1]; for (const [ts, s] of f) { if (ts <= ms) r = s; else break; } return r; };
const lastOf = (clip) => M[clip][M[clip].length - 1][1];
const clipDur = (clip) => M[clip][M[clip].length - 1][0];

/* ---------- builders ---------- */
function scene(id) { const s = $(`<div class="scene" id="${id}"></div>`); stage.appendChild(s); return s; }
function textBlock(parent, { x, y, w = 760, num, eyebrow, title, sub, size }) {
  const el = $(`<div class="tb abs" style="left:${x}px;top:${y}px;width:${w}px">
    <div class="badge"><div class="num">${num}</div><span>${eyebrow}</span></div>
    <h1 style="${size ? `font-size:${size}px` : ''}">${title.split(' ').map((w) => `<span>${w}</span>`).join('')}</h1>
    ${sub ? `<p>${sub}</p>` : ''}</div>`);
  parent.appendChild(el);
  return el;
}
function animText(el, t, t0, out = 1e9) {
  const badge = el.querySelector('.badge'), words = [...el.querySelectorAll('h1 span')], sub = el.querySelector('p');
  const k = eo(P(t, t0, t0 + .5));
  badge.style.opacity = k; badge.style.transform = `translateY(${(1 - k) * 14}px)`;
  words.forEach((w, i) => { const q = eo(P(t, t0 + .15 + i * .085, t0 + .6 + i * .085)); w.style.opacity = q; w.style.filter = `blur(${(1 - q) * 10}px)`; w.style.transform = `translateY(${(1 - q) * 26}px)`; });
  if (sub) { const q = eo(P(t, t0 + .35 + words.length * .085, t0 + .95 + words.length * .085)); sub.style.opacity = q; sub.style.transform = `translateY(${(1 - q) * 16}px)`; }
  const o = 1 - P(t, out, out + .4); el.style.opacity = o;
}
function phone(parent) {
  const el = $(`<div class="phone"><div class="scr"><canvas width="780" height="1688"></canvas><div class="ov"></div></div><div class="notch"></div></div>`);
  parent.appendChild(el);
  el.cv = el.querySelector('canvas'); el.ctx = el.cv.getContext('2d'); el.cur = null; el.ov = el.querySelector('.ov');
  el.rips = [];
  return el;
}
function show(ph, src, src2, mix) {
  const key = src + (src2 ? '|' + src2 + mix.toFixed(2) : '');
  if (ph.cur === key) return; ph.cur = key;
  ph.ctx.globalAlpha = 1; ph.ctx.drawImage(IMG[src], 0, 0, 780, 1688);
  if (src2 && mix > 0) { ph.ctx.globalAlpha = mix; ph.ctx.drawImage(IMG[src2], 0, 0, 780, 1688); ph.ctx.globalAlpha = 1; }
}
function place(ph, { x, y, s = 1, ry = 0, rx = 0, o = 1 }) {
  ph.style.left = (x - 207) + 'px'; ph.style.top = (y - 434) + 'px'; ph.style.opacity = o;
  ph.style.transform = `perspective(2200px) rotateY(${ry}deg) rotateX(${rx}deg) scale(${s})`;
}
function ripple(ph, x, y, t, at) {
  let r = ph.rips.find((q) => q.at === at);
  if (!r) { r = { at, el: $(`<div class="rip"></div>`) }; ph.querySelector('.scr').appendChild(r.el); ph.rips.push(r); }
  r.el.style.left = x + 'px'; r.el.style.top = y + 'px';
  const k = P(t, at, at + .55);
  r.el.style.opacity = k > 0 && k < 1 ? (1 - k) : 0;
  r.el.style.transform = `scale(${.5 + k * 1.3})`;
}
function seqShow(ph, clip, t, t0, rate = 1, hold = true) { show(ph, frameAt(clip, Math.max(0, (t - t0) * 1000 * rate))); }

/* ---------- timeline ---------- */
const S = { hook: [0, 6.5], tap: [6.5, 17], think: [17, 31], vibe: [31, 41], lang: [41, 49.3], pick: [49.3, 56.6], agent: [56.6, 73], nudge: [73, 88], dash: [88, 101], end: [101, 109] };
const DUR = 109;
const R = {};

function build() {
/* S0 HOOK */
(() => {
  const s = R.hook = scene('hook');
  s.innerHTML = `<div class="abs" id="hc" style="left:850px;top:300px;width:220px;height:220px">
      ${[0, 1, 2].map((i) => `<div class="abs hr" style="inset:0;border-radius:50%;background:#E5322D"></div>`).join('')}
      <div class="abs" id="hdot" style="inset:0;border-radius:50%;background:#E5322D;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 30px 70px rgba(229,50,45,.45)">${ic('mic', 84)}</div></div>
    <div class="abs words" id="h1" style="left:0;width:1920px;top:620px;text-align:center;font-size:84px;font-weight:800;letter-spacing:-.03em">${'Moving to Princeton?'.split(' ').map((w) => `<span>${w}</span>`).join('')}</div>
    <div class="abs words coral" id="h2" style="left:0;width:1920px;top:730px;text-align:center;font-size:84px;font-weight:800;letter-spacing:-.03em">${'Just say the place.'.split(' ').map((w) => `<span>${w}</span>`).join('')}</div>
    <div class="abs" id="hlogo" style="left:0;width:1920px;top:930px;text-align:center;font-size:22px;font-weight:700;color:#8A8285;letter-spacing:.02em">pebble</div>`;
  R.hook.f = (t) => {
    const c = s.querySelector('#hc'), k = back(P(t, .1, .8));
    const big = eio(P(t, 5.6, 6.6));
    c.style.transform = `scale(${k * (1 + big * 9)})`; c.style.opacity = 1 - P(t, 6.1, 6.6);
    s.querySelectorAll('.hr').forEach((r, i) => { const ph = ((t + i * .55) % 1.65) / 1.65; r.style.transform = `scale(${1 + ph * 1.2})`; r.style.opacity = (1 - ph) * .35 * (t > .6 ? 1 : 0); });
    const words = (id, t0) => s.querySelectorAll(`#${id} span`).forEach((w, i) => { const q = eo(P(t, t0 + i * .13, t0 + .45 + i * .13)); w.style.opacity = q; w.style.filter = `blur(${(1 - q) * 12}px)`; w.style.transform = `translateY(${(1 - q) * 30}px)`; });
    words('h1', 1.0); words('h2', 2.25);
    s.querySelector('#h1').style.opacity = s.querySelector('#h2').style.opacity = 1 - P(t, 5.5, 6.0);
    s.querySelector('#hlogo').style.opacity = P(t, 3.4, 4) * (1 - P(t, 5.5, 6));
  };
})();

/* S1 TAP */
(() => {
  const s = R.tap = scene('tap');
  const tb = textBlock(s, { x: 170, y: 330, num: '01', eyebrow: 'Customer app', title: "Tap. Talk. That's it.", sub: 'One tap and Pebble keeps listening while you ramble — the way you\'d describe a home to a friend.' });
  const ph = phone(s);
  const live = $(`<div class="chip abs" style="left:1560px;top:250px">${'<span class="d"></span>'}Listening, continuously</div>`); s.appendChild(live);
  s.f = (t) => {
    animText(tb, t, 6.8);
    const k = eo(P(t, 6.5, 7.7));
    place(ph, { x: 1300, y: 545 + (1 - k) * 160, ry: -16 + k * 8 + P(t, 7.7, 17) * 5, rx: 4 - k * 2, o: k });
    if (t < 8.35) show(ph, 'cap/c_home.jpg'); else show(ph, frameAt('c_listen', Math.min(7150, (t - 8.35) * 1000 * .86)));
    ripple(ph, 195, 453, t, 8.0);
    const q = eo(P(t, 8.8, 9.3)); live.style.opacity = q * (1 - P(t, 16.3, 16.8)); live.style.transform = `translateY(${(1 - q) * 20}px)`;
  };
})();

/* S2 THINK — how Pebble listens, understands, searches */
(() => {
  const s = R.think = scene('think');
  const tb = textBlock(s, { x: 120, y: 80, w: 1400, num: '02', eyebrow: 'AI listens → understands → searches', title: 'From rambling to three homes.', size: 60 });
  const phrases = [['starting a job at Princeton in August', 0], ['cozy', 1], ['2-bedroom', 2], ['under $3,000', 3], ['walkable to campus', 4], ['I have a dog', 5]];
  const sentence = "“I'm starting a job at Princeton in August, need a cozy 2-bedroom under $3,000, walkable to campus, I have a dog.”";
  let html = sentence;
  phrases.forEach(([p, i]) => (html = html.replace(p, `<span class="hl" data-i="${i}">${p}</span>`)));
  const tr = $(`<div class="card abs" style="left:120px;top:300px;width:520px;padding:34px 36px 40px"><div class="lbl">${ic('mic', 18)} What Sarah said</div><div style="font-size:31px;line-height:1.38;font-weight:600;margin-top:18px;letter-spacing:-.01em">${html}</div></div>`);
  s.appendChild(tr);
  const chips = ['New hire · August', 'Vibe: cozy', '2+ bedrooms', 'Up to $3,000 / mo', 'Walk to campus', 'Dog-friendly'];
  const und = $(`<div class="card abs" style="left:690px;top:300px;width:350px;height:560px;padding:30px 26px"><div class="lbl coral">${ic('spark', 18)} What Pebble understood</div></div>`);
  s.appendChild(und);
  const chipEls = chips.map((c, i) => { const e = $(`<div class="chip abs ${i === 1 ? 'red' : ''}" style="left:0;top:0;font-size:20px;padding:11px 18px"><span class="d"></span>${c}</div>`); s.appendChild(e); return e; });
  const grid = $(`<div class="card abs" style="left:1090px;top:300px;width:500px;height:560px;padding:30px 26px"><div class="lbl">${ic('chart', 18)} Searching every listing <span id="cnt" style="margin-left:auto;color:#1D1A1C;font-size:22px;font-weight:800">49</span></div><div id="filt" style="position:absolute;left:26px;bottom:26px;font-size:17px;font-weight:600;color:#E5322D"></div></div>`);
  s.appendChild(grid);
  const thumbs = G.ids.map((id, i) => { const e = $(`<div class="thumb"><canvas width="116" height="88"></canvas></div>`); const c = e.querySelector('canvas').getContext('2d'); const im = IMG[`cap/art_${id}.jpg`]; const sh = Math.min(im.width, im.height * 116 / 88); c.drawImage(im, (im.width - sh) / 2, 0, sh, sh * 88 / 116, 0, 0, 116, 88); s.appendChild(e); return e; });
  const ph = phone(s);
  const bubble = $(`<div class="card abs" style="left:1090px;top:890px;width:500px;padding:18px 24px;display:flex;gap:14px;align-items:center"><div style="width:40px;height:40px;border-radius:50%;background:#E5322D;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0">${ic('speaker', 20)}</div><div style="font-size:19px;font-weight:600;line-height:1.3">“Got it: a cozy two-bed rental… Here are my top three.”</div></div>`);
  s.appendChild(bubble);
  const filters = ['Rent · under $3,000', '2+ bedrooms', 'Dog-friendly', 'Walk to campus', 'Vibe: cozy'];
  const waveT = [23.1, 23.7, 24.3, 24.9, 25.5];
  s.f = (t) => {
    animText(tb, t, 17.2);
    tr.style.opacity = eo(P(t, 17.3, 17.8)); tr.style.transform = `translateY(${(1 - eo(P(t, 17.3, 17.8))) * 30}px)`;
    und.style.opacity = eo(P(t, 17.6, 18.1)); grid.style.opacity = eo(P(t, 21.6, 22.1));
    const order = [0, 1, 2, 3, 4, 5];
    tr.querySelectorAll('.hl').forEach((h) => { const i = +h.dataset.i; const q = P(t, 18.1 + i * .55, 18.4 + i * .55); h.style.background = `rgba(252,227,225,${q})`; h.style.color = q > .5 ? '#C4231F' : '#1D1A1C'; });
    const srMap = [0, 1, 2, 3, 4, 5];
    chipEls.forEach((e, i) => {
      const h = tr.querySelector(`.hl[data-i="${i}"]`);
      const hb = h.getBoundingClientRect();
      const fx = hb.left, fy = hb.top - 6, tx = 716, ty = 370 + i * 76;
      const k = eio(P(t, 18.3 + i * .55, 18.95 + i * .55));
      const x = lerp(fx, tx, k), y = lerp(fy, ty, k) - Math.sin(k * Math.PI) * 60;
      e.style.left = x + 'px'; e.style.top = y + 'px'; e.style.opacity = P(t, 18.3 + i * .55, 18.45 + i * .55);
      e.style.transform = `scale(${.7 + .3 * k})`;
    });
    // grid
    let alive = 49;
    G.ids.forEach((id, i) => {
      const e = thumbs[i];
      const col = i % 7, row = Math.floor(i / 7);
      let x = 1116 + col * 64, y = 360 + row * 56;
      const a = eo(P(t, 21.8 + i * .012, 22.2 + i * .012));
      let op = a, sc = .6 + .4 * a;
      G.waves.forEach((w, wi) => { if (w.includes(i)) op *= 1 - .88 * P(t, waveT[wi], waveT[wi] + .3); });
      const ti = G.top.indexOf(i);
      if (ti >= 0) {
        const g = P(t, 25.5, 25.9); sc *= 1 + .25 * g; e.style.boxShadow = `0 0 0 ${3 * g}px #E5322D`;
        const f = eio(P(t, 26.0 + ti * .12, 26.8 + ti * .12));
        x = lerp(x, 1660, f); y = lerp(y, 520 + ti * 10, f) - Math.sin(f * Math.PI) * 90; op *= 1 - P(t, 26.7 + ti * .12, 26.9 + ti * .12);
      }
      e.style.left = x + 'px'; e.style.top = y + 'px'; e.style.opacity = op; e.style.transform = `scale(${sc})`;
    });
    let n = 49; G.waves.forEach((w, wi) => { if (t > waveT[wi] + .15) n -= w.length; });
    grid.querySelector('#cnt').textContent = t > 21.9 ? n : '';
    const fi = waveT.filter((w) => t > w).length;
    grid.querySelector('#filt').innerHTML = fi ? `${ic('check', 16)} ${filters.slice(0, fi).join('  ·  ')}` : '';
    const pk = eo(P(t, 17.4, 18.4));
    place(ph, { x: 1745, y: 580 + (1 - pk) * 100, s: .74, ry: -10 + pk * 4, o: pk });
    if (t < 26.9) show(ph, frameAt('c_listen', 7254 + ((t - 17) * 1000) % 840));
    else if (t < 27.65) show(ph, frameAt('c_listen', 8220 + (t - 26.9) * 1000));
    else if (t < 28.55) seqShow(ph, 'c_think', t, 27.65);
    else if (t < 28.7) show(ph, lastOf('c_res1'));
    else if (t < 29.6) seqShow(ph, 'c_slide1', t, 28.7);
    else seqShow(ph, 'c_slide2', t, 29.6);
    const bq = eo(P(t, 27.3, 27.8)); bubble.style.opacity = bq; bubble.style.transform = `translateY(${(1 - bq) * 20}px)`;
  };
})();

/* S3 VIBE */
(() => {
  const s = R.vibe = scene('vibe');
  const tb = textBlock(s, { x: 170, y: 120, w: 820, num: '03', eyebrow: 'Vibe search', title: 'It gets the feeling, too.', sub: 'An image model tags every listing photo: style, materials, colors, light.' });
  const photo = $(`<div class="card abs" style="left:170px;top:470px;width:600px;height:500px;overflow:hidden"><canvas width="780" height="650" style="width:600px;height:500px;display:block"></canvas><div id="scan" class="abs" style="left:0;width:600px;height:4px;background:#E5322D;box-shadow:0 0 24px 6px rgba(229,50,45,.5)"></div></div>`);
  s.appendChild(photo);

function render(t) {
  document.getElementById('b1').style.transform = `translate(${Math.sin(t * .15) * 80}px, ${Math.cos(t * .11) * 60}px)`;
  document.getElementById('b2').style.transform = `translate(${Math.cos(t * .13) * 90}px, ${Math.sin(t * .09) * 50}px)`;
  order.forEach((k, i) => {
    const [a, b] = S[k]; const s = R[k];
    const first = i === 0, last = i === order.length - 1;
    const vin = first ? 1 : P(t, a - .3, a + .35), vout = last ? 0 : P(t, b - .3, b + .35);
    const vis = t >= a - .35 && t <= b + .4;
    s.style.display = vis ? 'block' : 'none';
    if (!vis) return;
    const o = eo(vin) * (1 - eio(vout));
    s.style.opacity = o;
    const sc = (1 + (1 - eo(vin)) * .035) * (1 - eio(vout) * .03);
    const bl = (1 - eo(vin)) * 10 + eio(vout) * 10;
    s.style.transform = `scale(${sc})`;
    s.style.filter = bl > .2 ? `blur(${bl}px)` : 'none';
    s.f(t);
    if (k === 'end') s.style.opacity = o * (1 - P(t, 108.2, 109));
  });
}
window.DUR = DUR;
window.ready = load().then(() => { build(); window.render = render; render(0); return true; });
</script></body></html>
